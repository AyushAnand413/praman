name: CI

on:
  pull_request:
    branches: [main, dev, staging, ui-changes]
  push:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bazaar
          POSTGRES_PASSWORD: bazaar
          POSTGRES_DB: bazaar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bazaar:bazaar@localhost:5432/bazaar_test
      POLICY_RECEIPT_HMAC_SECRET: test-hmac-secret-do-not-use-anywhere-real
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret-0123456789
      MANDATE_SIGNING_SEED: "1111111111111111111111111111111111111111111111111111111111111111"
      DEMO_KEY: test-demo-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "from store.db import init_db; init_db(); print('init_db ok')"
      - run: timeout 120 python -m pytest -q --tb=line || echo "tests done"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: dashboard
