name: CI

on:
  pull_request:
    branches: [main, dev, staging, ui-changes]
  push:
    branches: [dev, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bazaar
          POSTGRES_PASSWORD: bazaar
          POSTGRES_DB: bazaar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bazaar:bazaar@localhost:5432/bazaar_test
      POLICY_RECEIPT_HMAC_SECRET: test-hmac-secret-do-not-use-anywhere-real
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret-0123456789
      MANDATE_SIGNING_SEED: "1111111111111111111111111111111111111111111111111111111111111111"
      DEMO_KEY: test-demo-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Verify DB connection and schema translation
        run: python -c "from store.db import init_db; init_db(); print('init_db postgres ok')"
      - name: Run tests (Postgres bazaar_test)
        run: python -m pytest -q --tb=short
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

  verify-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging health (if STAGING_URL secret set)
        run: |
          if [ -n "${{ secrets.STAGING_URL }}" ]; then
            curl -f ${{ secrets.STAGING_URL }}/health
          else
            echo "No STAGING_URL secret - skipping health check (add it in GitHub Secrets to enable)"
          fi

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health (if PROD_URL secret set)
        run: |
          if [ -n "${{ secrets.PROD_URL }}" ]; then
            curl -f ${{ secrets.PROD_URL }}/health
          else
            echo "No PROD_URL secret - skipping health check (add https://praman-brain.vercel.app in GitHub Secrets to enable)"
          fi
