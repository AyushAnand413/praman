[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    live_api: hits the real Razorpay test-mode API. Deselected unless --live-api
        is passed, so the default suite stays hermetic, offline, and safe to run
        without credentials.
filterwarnings =
    error::DeprecationWarning:store.*
    error::DeprecationWarning:kernel.*
    error::DeprecationWarning:api.*

# pytest-asyncio is installed globally in this environment and warns at
# plugin-load time (too early for filterwarnings) unless this is set. Nothing
# here is async-tested; the value just silences the nag.
asyncio_default_fixture_loop_scope = function
